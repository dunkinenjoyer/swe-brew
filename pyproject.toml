[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-brew"
version = "0.1.0"
description = "Reference-assisted benchmark test enhancement with deterministic six-cell verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "swe-brew contributors" }]

dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "unidiff>=0.7.5",
  "gitpython>=3.1",
  "docker>=7.1",
  "httpx>=0.27",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "pytest-mock>=3.12", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
# Single-case benchmark enhancement: snapshot -> setup -> organize ->
# generate -> six-cell verify on one task directory.
swe-brew-enhance = "swe_brew.benchmark.enhance:main"
# Live fleet monitor: reads telemetry.jsonl from a running batch.
swe-brew-watch = "swe_brew.agent.watch:main"
# NOTE: the pass@k union merger (swe_brew.benchmark.passk_merge) ships as a
# library module only, not a console script. It is invoked programmatically
# by the pass@k fleet aggregation path, so it is intentionally not exposed
# on the command line.

[tool.setuptools.packages.find]
where = ["src"]
include = ["swe_brew*"]

[tool.setuptools.package-data]
swe_brew = ["benchmark/prompts/*.md"]
